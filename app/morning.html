<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<style>
  /* 早安日报: a small window in the game's Windose frame (same 9-slice as the Claude panel) */
  @font-face { font-family: "PixelMplus"; src: url(assets/dialog/PixelMplus12-Regular.ttf); }
  :root { --ink: rgb(58, 34, 84); --blue: rgb(77, 35, 207); --pink: rgb(240, 209, 241); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; }
  #box { position: absolute; inset: 0; box-sizing: border-box; border-style: solid; border-width: 40px 12px 24px 12px;
    border-image: url(assets/dialog/windowbase_active.png) 40 12 24 12 fill stretch; image-rendering: pixelated;
    font-family: "PixelMplus", "Microsoft YaHei UI", sans-serif; font-size: 13px; line-height: 19px; color: var(--ink); cursor: pointer; }
  #title { position: absolute; left: 3px; right: 6px; top: -31px; height: 20px; display: flex; align-items: center; gap: 8px;
    color: var(--blue); font-size: 12px; white-space: nowrap; }
  #title span { flex: 1; }
  #close { width: 16px; height: 16px; line-height: 14px; text-align: center; border: 1px solid var(--blue); background: var(--pink); cursor: pointer; font-size: 12px; }
  #close:hover { background: #fff; }
  #body { padding: 2px 6px; height: 100%; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; gap: 3px; }
  #head { color: var(--blue); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #more { font-size: 12px; color: rgba(58, 34, 84, .75); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #hint { margin-top: auto; font-size: 11.5px; color: rgba(77, 35, 207, .7); }
  #box:hover #hint { text-decoration: underline; }
</style>
</head>
<body>
<div id="box">
  <div id="title"><span>早安～糖糖的早报</span><div id="close" title="收起">×</div></div>
  <div id="body"><div id="head"></div><div id="more"></div><div id="week"></div><div id="hint">点这里看完整日报</div></div>
</div>
<script src="morning-page.js"></script>
</body>
</html>
