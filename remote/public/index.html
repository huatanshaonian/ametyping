<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Windose</title>
<link rel="icon" href="/icons/computer_2-16.png">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/dash.css">
<link rel="stylesheet" href="/css/files.css">
</head>
<body>
<main id="desktop">
  <div id="icons" role="list"></div>
  <div id="mark"></div>
</main>
<div id="windows"></div>
<aside id="netpanel">
  <div class="ptitle"><img src="/icons/network_normal_two_pcs-16.png" alt="">网上邻居</div>
  <div id="machines"><div class="empty">还没有电脑连上来。</div></div>
</aside>
<div id="startmenu" hidden>
  <div class="band"><span>Windose 98</span></div>
  <div class="items"></div>
</div>
<footer id="taskbar">
  <button id="startbtn" type="button"><img src="/img/start_logo.png" alt="">开始</button>
  <div class="tb-sep"></div>
  <div id="dock"></div>
  <div id="tray">
    <button id="netbtn" type="button" title="网上邻居"><img src="/icons/network_normal_two_pcs-16.png" alt="网上邻居"></button>
    <span id="conn">连接中</span>
    <span id="clock"></span>
  </div>
</footer>
<div id="gate" hidden>
  <form autocomplete="off">
    <div class="gt">再次验证</div>
    <div class="gb">
      <p>远程操作前需要验证码（1 小时内有效）。</p>
      <input inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required>
      <div class="gm"></div>
      <div class="ga"><button class="btn" type="button" data-act="cancel">取消</button><button class="btn go" type="submit">确定</button></div>
    </div>
  </form>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
